<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Extreme</title>
<base href="/">
<link rel="icon" href="data:,">
<style>:root{color-scheme:light dark;--p:light-dark(#f7f5f0,#17161b);--i:light-dark(#1c1b21,#ecebf1);--m:light-dark(#5e5b66,#a7a3b2);--l:light-dark(#dbd6cc,#34323c);--a:light-dark(#512bd4,#a993f5)}body{margin:0 auto;max-width:44rem;padding:1.5rem 1rem 4rem;background:var(--p);color:var(--i);font:1.0625rem/1.6 system-ui,sans-serif}#app::before{content:attr(data-app);display:block;font:600 .8125rem ui-monospace,monospace;color:var(--m)}nav{font-size:0;display:flex;gap:1.5rem;margin:.5rem 0 2.5rem;padding-bottom:.75rem;border-bottom:1px solid var(--l)}nav a{font-size:1rem;color:var(--m);text-decoration:none}nav a:hover,nav .active{color:var(--a)}nav .active{font-weight:600}a{color:var(--a)}h1{font-size:2.25rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 .75rem}h1+p:last-child{color:var(--m)}[role=status]{font:600 clamp(1.75rem,7vw,3rem)/1.1 ui-monospace,monospace;font-variant-numeric:tabular-nums;margin:2rem 0}button{font:inherit;font-weight:600;color:var(--p);background:var(--a);border:0;border-radius:.375rem;padding:.625rem 1.5rem;cursor:pointer}:focus-visible{outline:2px solid var(--a);outline-offset:3px}ul{list-style:none;padding:0;border-top:1px solid var(--l)}li{padding:.625rem 0;border-bottom:1px solid var(--l);font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="app" data-app="Extreme">Loading...</div>
<script>getData=u=>fetch(u).then(r=>r.json()).then(d=>[d.message,...d.items].join("\n"))</script>
<script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
