name: Blazor WebAssembly minification demo - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read   # configure-pages reads the site's base path
    env:
      # user-writable SDK location, so `dotnet workload install` needs no sudo
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json   # pins SDK 11.0.100

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Install native deps (libatomic1 for emsdk's node)
        run: sudo apt-get update && sudo apt-get install -y libatomic1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install node tools (terser, playwright)
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell

      - name: Build both variants (same recipe as the measured final state)
        run: |
          ./build.sh honest
          ./build.sh extreme

      - name: Measure cold-load sizes (functional check + network log)
        run: |
          node tools/check.mjs artifacts/honest/wwwroot artifacts/honest.netlog.json
          node tools/measure.mjs artifacts/honest/wwwroot artifacts/honest.netlog.json honest
          PORT=5081 node tools/check.mjs artifacts/extreme/wwwroot artifacts/extreme.netlog.json
          node tools/measure.mjs artifacts/extreme/wwwroot artifacts/extreme.netlog.json extreme

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble site under the Pages base path
        env:
          BASE_PATH_IN: ${{ steps.pages.outputs.base_path }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          node tools/assemble-site.mjs "$BASE_PATH_IN/" _site \
            artifacts/honest.netlog.sizes.json artifacts/extreme.netlog.sizes.json \
            --repo "$REPO_URL"

      - name: Gate - check both apps under the base path, Pages-like server
        env:
          BASE_PATH_IN: ${{ steps.pages.outputs.base_path }}
        run: |
          base="$BASE_PATH_IN/"
          for v in honest extreme; do
            SITE_DIR=_site SITE_PREFIX="$base" BASE_PATH="${base}${v}/" node tools/check.mjs "_site/$v"
          done
          node tools/pages-deeplink.mjs _site "$base"
          node tools/site-check.mjs pages _site "$base"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
